<div class="flex justify-center items-center h-screen bg-gray-200">
  <div class="grid grid-cols-1 md:grid-cols-2 pl-0 pt-0 w-220 h-140 bg-gradient-to-t from-blue-300 to-white  rounded-xl overflow-hidden">

    <!-- this for the left side grid -->
    <div class="bg-gradient-to-t from-blue-300 to-purple-400 rounded-t-4xl rounded-l-xl flex  items-center hidden md:block ">
      <h1 class="text-lg font-bold"></h1>

      </div>
    <!-- this for the right side grid -->
    <div
      class="cols-span-1 text-center flex flex-col gap-2 justify-center px-5 bg-white rounded-bl-4xl rounded-r-xl bg-blue-400 p-4 md:p-7 "
    >
      <h1
        class="font-bold text-xl md:text-2xl text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-purple-600 mb-3  pt-3 pl-2 text-center"
      >
        Create Your Account
      </h1>
      <p  class="text-gray-400 text-sm mb-3  ">Create an account to get started — it only takes a minute.</p>
         
      
      <div class="inputs flex flex-col gap-2 h-full pt-2 ">
            <input 
              type="text" 
              placeholder="Full name"  
              class="w-full  mb-2 px-4 py-3 bg-gray-50 hover:bg-gray-100 focus:bg-white rounded-xl border border-transparent focus:border-gray-300 outline-none transition-all duration-200 text-sm font-light text-gray-700 placeholder-gray-400 "/> 
          <input 
              type="email" 
              placeholder="example@email.com "  
              class="w-full  mb-2 px-4 py-3 bg-gray-50 hover:bg-gray-100 focus:bg-white rounded-xl border border-transparent focus:border-gray-300 outline-none transition-all duration-200 text-sm font-light text-gray-700 placeholder-gray-400 "/> 
          
          <div class="password-field relative flex items-center flex-col gap-2"> 
            <input 
                type="password" 
                name="password" 
                id="password" 
                placeholder="●●●●●●●" 
                class="w-full px-4 py-3 bg-gray-50 hover:bg-gray-100 focus:bg-white rounded-xl border border-transparent focus:border-gray-300 outline-none transition-all duration-200 text-sm font-light text-gray-700 placeholder-gray-400"
                [type]="hidepassword ? 'password' : 'text'"/>
                <button 
                class=" text-gray-500 absolute right-1 top-1/5 -translate-y-1/3 text-gray-400 hover:text-gray-600 transition-colors"
              (click)="viewpassword()"
              type="button">
                  <i [class]="hidepassword ? 'pi pi-eye text-base' : 'pi pi-eye-slash text-base'"></i>
              </button>
              <input 
                type="password" 
                name="password" 
                id="password" 
                placeholder="●●●●●●●" 
                class="w-full px-4 py-3 bg-gray-50 hover:bg-gray-100 focus:bg-white rounded-xl border border-transparent focus:border-gray-300 outline-none transition-all duration-200 text-sm font-light text-gray-700 placeholder-gray-400"
                [type]="hidepassword ? 'password' : 'text'"/>



      </div>

         </div>
          
     
      <div class="flex justify-between items-center w-full px-2 m-2">
        
        <div class="flex items-center">
          <input type="checkbox" name="terms" id="terms" class="mr-2 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
          <label for="terms" class="text-gray-500 hover:text-gray-600 transition-colors text-sm">I agree to the terms</label>
        </div>

      </div>

      <!-- buttons -->
      <div class="singup-btn text-center mt-2 f md:m-2 mb-4  w-full">
          <button
        type="button"
        class="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-purple-900 hover:to-blue-700 transition-all duration-4500 ease-in-out active:scale-95 text-white font-bold py-2 px-1 rounded-full font-bold shadow-blue-500/20"
      >
        <i class="pi pi-user-plus"></i>
        <span class="inline p-3.5 ">Sign Up</span>
      </button>
      </div>

      <div class="qusation text-left mt-4 px-1 md:mt-1 px-1  mt-10 w-full">
        <span class="text-gray-500 text-sm ml-2">Already have an account ? </span>
        <a routerLink="/auth/login" class="text-blue-500 hover:text-blue-700 font-bold text-sm">Login</a>
      </div>

      
     
    </div>
  </div>
</div>
