<div class="flex justify-center items-center h-screen bg-gray-200">
  <div class="grid grid-cols-1 md:grid-cols-2 pl-0 pt-0 w-220 h-130 bg-gradient-to-t from-blue-300 to-white  rounded-xl overflow-hidden">

    <!-- this for the left side grid -->
    <div class="bg-gradient-to-t from-blue-300 to-purple-400 rounded-t-4xl rounded-l-xl flex  items-center hidden md:block">
      <h1 class="text-lg font-bold"></h1>

      </div>
    <!-- this for the right side grid -->
    <div
      class="cols-span-1 text-center flex flex-col gap-2 justify-center px-5 bg-white rounded-bl-4xl rounded-r-xl bg-blue-400"
    >
      <h1
        class="font-bold text-lg text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-purple-600 "
      >
        Login To Your Account!
      </h1>
      <input type="text" placeholder="example@email.com" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      <input type="password" name="password" id="password" placeholder="●●●●●●●" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      <a href="#" class="text-blue-500 hover:text-blue-700">Forgot Password?</a>
      <!-- buttons -->
      <button
        type="button"
        class="bg-gradient-to-r from-blue-500 to-purple-600 hover:from-purple-900 hover:to-blue-700 transition-all duration-4500 ease-in-out active:scale-95 text-white font-bold py-2 px-4 rounded-xl p-2 m-1"
      >
        <i class="pi pi-user"></i>
        <span class="inline p-3.5">Sign In</span>
      </button>

     
    </div>
  </div>
</div>
