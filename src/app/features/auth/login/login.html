<div class="flex min-h-screen items-center justify-center bg-gray-100 px-4 py-12 sm:px-6 lg:px-8">
  <div class="w-full max-w-md space-y-8 rounded-2xl bg-white p-8 shadow-md">
    <div class="text-center">
      <h2 class="text-3xl font-bold tracking-tight text-gray-900">Login to Your Account</h2>
      <p class="mt-2 text-sm text-gray-600">
        Or <a routerLink="/auth/singup" class="font-medium text-indigo-600 hover:text-indigo-500">create a new account </a>      </p>
    </div>

    <form class="mt-8 space-y-6" action="#" method="POST">
      <div class="space-y-4 rounded-md shadow-sm">
        <div>
          <label for="email-address" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
          <input id="email-address" name="email" type="email" autocomplete="email" required
            class="relative block w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 placeholder-gray-400 focus:z-10 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 sm:text-sm"
            placeholder="you@example.com">
        </div>

        <div class="relative w-full">
    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
    
    <!-- غلاف حقل الإدخال والزر -->
    <div class="relative">
        <input 
            id="password" 
            name="password" 
            [type]="hidepassword ? 'password' :'text'"
            type="password" 
            autocomplete="current-password" 
            required
            class="block w-full rounded-lg border border-gray-300 pl-3 pr-10 py-2 text-gray-900 placeholder-gray-400 focus:z-10 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 sm:text-sm"
            placeholder="••••••••">
        
        <button 
            type="button"
            (click)="viewpassword()" 
            class="absolute inset-y-0 right-0 flex items-center justify-center px-3 text-gray-500 hover:text-indigo-600 active:scale-95 active:text-indigo-800 transition-all duration-200 focus:outline-none"
            title="Show password">
            <i [class]="hidepassword ? 'pi pi-eye' : 'pi pi-eye-slash'" ></i>
        </button>
    </div>
</div>
      </div>

      <div class="flex items-center justify-between text-sm">
        <div class="flex items-center">
          <input id="remember-me" name="remember-me" type="checkbox"
            class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
          <label for="remember-me" class="ml-2 block text-gray-900">Remember me</label>
        </div>

        <div>
          <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500">Forgot password?</a>
        </div>
      </div>

      <div>
        <button type="submit"
          class="group relative flex w-full justify-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors duration-200">
          Login
        </button>
      </div>

      <p class="text-center text-sm text-gray-600">
        Don't have an account? <a routerLink="/auth/singup" class="font-medium text-indigo-600 hover:text-indigo-500">Sign Up</a>
      </p>
    </form>
  </div>
</div>
