<div class="flex justify-center items-center h-screen bg-gray-200">
  <div class="grid grid-cols-1 md:grid-cols-2 pl-0 pt-0 w-220 h-140 bg-gradient-to-t from-blue-300 to-white  rounded-xl overflow-hidden">
    
    <!-- this for the left side grid -->
    <div class="bg-gradient-to-t from-blue-300 to-purple-400 rounded-t-4xl rounded-l-xl flex  items-center hidden md:block">
      <h1 class="text-lg font-bold"></h1>

      <p-image src="assets/images/Fingerprint (1).png" alt="not found" imageClass="flex justify-center rounded-xl py-6" />
    </div>
    <!-- this for the right side grid -->
    <div
      class="cols-span-1 text-center flex flex-col gap-2 justify-center px-5 bg-white rounded-bl-4xl rounded-r-xl bg-blue-400"
    >
      <h1
        class="font-bold text-2xl text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-purple-600"
      >
        Welcome back!
      </h1>

      <p class="text-gray-500 text-sm">Please select an option to continue.</p>

      <button
        routerLink="/auth/login"
        type="button"
        class=" bg-gradient-to-r from-blue-500 to-purple-600 hover:from-purple-900 hover:to-blue-700 transition-all duration-4500 ease-in-out active:scale-95 text-white font-bold py-2 px-4 rounded-3xl p-2 m-1"
      >
        <i class="pi pi-user"></i>
        <span class="inline p-3.5">Login</span>
      </button>

      <button
        routerLink="/auth/singup"
        type="button"
        class="bg-gradient-to-r from-blue-500 to-purple-600 hover:from-purple-900 hover:to-blue-700 transition-all duration-700 ease-in-out text-white font-bold py-2 px-4 rounded-3xl p-2 m-1"
      >
        <i class="pi pi-user-plus"></i>
        <span class="inline p-2">Sign Up</span>
      </button>
    </div>
  </div>
</div>
